<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Подарочная коробка на магнитах, закрытая, ракурс 45°">
  <!--
    Геометрия построена по primary reference (оранжевая магнитная коробка 21×15×8).
    Аксонометрия, камера поднята: верхняя панель занимает основную площадь кадра,
    вертикальные плоскости низкие (высота ~8 см против 21×15 основания).

    Опорные вершины:
      A_top 59,170   Back_top 247,95   B_top 488,192   F_top 300,267
      A     59,228                     B     488,250   F     300,325

    Зоны:
      #zone-outer-top   — верхняя панель складной оболочки
      #zone-outer-front — видимая closing panel + узкая полоса front wall под ней
      #zone-side        — боковая грань (единственная зона второго цвета)

    Двухслойность closing panel / front wall передана геометрией (панель
    заканчивается выше нижнего ребра стенки), толщиной картона и контактной тенью.
    Магниты скрыты внутри конструкции и не изображаются.
  -->
  <defs>
    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="contact-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Базовое разделение поверхностей: top светлее, front среднее, side темнее -->
    <linearGradient id="shade-top" x1="0.1" y1="1" x2="0.75" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#fff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="sheen-top" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="45%" stop-color="#fff" stop-opacity="0.20" />
      <stop offset="62%" stop-color="#fff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shade-front" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06" />
      <stop offset="45%" stop-color="#000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="shade-side" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#000" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#000" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.12" />
    </linearGradient>

    <!-- Толщина картона по верхнему ребру оболочки -->
    <linearGradient id="card-edge-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="card-edge-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.20" />
    </linearGradient>

    <!-- Контактная тень под верхним ребром -->
    <linearGradient id="under-top-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="under-top-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>

    <!-- Стык closing panel ↔ front wall (нижняя кромка панели) -->
    <linearGradient id="panel-seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.10" />
    </linearGradient>

    <!-- Вертикальный стык front ↔ side -->
    <linearGradient id="corner-seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#fff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.20" />
    </linearGradient>

    <!-- Нижний кант -->
    <linearGradient id="bottom-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.22" />
    </linearGradient>
  </defs>

  <!-- Ground shadow: вторичная, объём читается по самой коробке -->
  <ellipse cx="280" cy="336" rx="235" ry="17" fill="url(#ground-shadow)" />
  <ellipse cx="270" cy="330" rx="150" ry="8" fill="url(#contact-shadow)" />

  <g id="zones">
    <!-- Верхняя панель -->
    <polygon id="zone-outer-top"
      points="59,170 247,95 488,192 300,267"
      fill="var(--zone-outer-top, #E5E5E5)" stroke="#1f2937" stroke-width="1.1" stroke-linejoin="round" />

    <!-- Closing panel + узкая полоса front wall под её кромкой -->
    <path id="zone-outer-front"
      d="M59,170 L300,267 L300,321 L59,224 Z M59,224 L300,321 L300,325 L59,228 Z"
      fill="var(--zone-outer-front, #E5E5E5)"
      stroke="#1f2937" stroke-width="1.1" stroke-linejoin="round" />

    <!-- Боковая грань -->
    <polygon id="zone-side"
      points="300,267 488,192 488,250 300,325"
      fill="var(--zone-side, #E5E5E5)" stroke="#1f2937" stroke-width="1.1" stroke-linejoin="round" />
  </g>

  <g id="lighting" pointer-events="none">
    <!-- Разделение поверхностей по свету -->
    <polygon points="59,170 247,95 488,192 300,267" fill="url(#shade-top)" />
    <polygon points="59,170 247,95 488,192 300,267" fill="url(#sheen-top)" />
    <polygon points="59,170 300,267 300,325 59,228" fill="url(#shade-front)" />
    <polygon points="300,267 488,192 488,250 300,325" fill="url(#shade-side)" />

    <!-- Толщина картона по верхнему ребру -->
    <polygon points="59,170 300,267 300,272 59,175" fill="url(#card-edge-front)" />
    <polygon points="300,267 488,192 488,197 300,272" fill="url(#card-edge-side)" />

    <!-- Контактная тень сразу под верхним ребром -->
    <polygon points="59,175 300,272 300,288 59,191" fill="url(#under-top-front)" />
    <polygon points="300,272 488,197 488,211 300,286" fill="url(#under-top-side)" />

    <!-- Стык closing panel ↔ front wall: нижняя кромка панели -->
    <polygon points="59,221 300,318 300,325 59,228" fill="url(#panel-seam)" />
    <path d="M59,224 L300,321" stroke="#000" stroke-opacity="0.26" stroke-width="1" fill="none" />

    <!-- Вертикальное ребро front ↔ side -->
    <polygon points="293,264 307,269 307,325 293,323" fill="url(#corner-seam)" />

    <!-- Тонкая кромка панели по левому вертикальному ребру -->
    <polygon points="59,170 63,172 63,226 59,224" fill="#fff" fill-opacity="0.12" />

    <!-- Нижний кант -->
    <polygon points="59,216 300,313 300,325 59,228" fill="url(#bottom-edge)" fill-opacity="0.55" />
    <polygon points="300,313 488,238 488,250 300,325" fill="url(#bottom-edge)" fill-opacity="0.55" />
  </g>
</svg>
